function doClone()
{
	var sel = -1;
	var radios = document.getElementsByName("cloneSel");
	for (var i = 0; i < radios.length; i++)
	{
		if (radios[i].checked) { sel = parseInt(radios[i].value); break; }
	}
	if (sel < 0)
	{
		alert("Seleziona una rete WiFi da clonare.");
		return;
	}
	var row = sel * 5;
	var clonedSsid = siteList[row + 1].toString();
	if (!clonedSsid || clonedSsid == " ")
	{
		alert("SSID vuoto (rete nascosta). Impossibile clonare.");
		return;

	if (!confirm("Clonare l'SSID \"" + clonedSsid + "\" e impostarlo come SSID del router?"))

	var url = "../userRpm/WlanNetworkRpm.htm"

var transMatrixHTML = new Array(
	/&/g, "&amp;",

	/"/g, "&quot;",
	/</g, "&lt;",

);
function transToHTML(str)
{
	for (var i = 0; i < transMatrixHTML.length; i+=2)
	{

	/>/g, "%3E",
	/ /g, "%20",
	/\+/g, "%2B",
	/\=/g, "%3D"
);
function transToURL(str)
{
	for (var i = 0; i < transMatrixURL.length; i+=2)
	{
		str = str.replace(transMatrixURL[i], transMatrixURL[i+1]);
	}
	return str;
}
